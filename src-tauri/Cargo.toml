[package]
name = "yara-research"
version = "1.1.1"
description = "Local-first scientific paper mapping and research notes"
authors = ["Yara Research"]
edition = "2021"
default-run = "yara-research"

[lib]
name = "yara_research_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
open = "5"
regex = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "yara-native-host"
path = "src/native_main.rs"
